<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DH PICTURES</title>
  <script>
    // GitHub Pages 404 redirection for SPA
    sessionStorage.redirect = location.href;
    var path = location.pathname;
    var segments = path.split('/').filter(Boolean);
    // If hosted on https://<user>.github.io/<repo>/, segments[0] is <repo>
    var repoPrefix = segments.length > 0 ? '/' + segments[0] + '/' : '/';
    location.replace(repoPrefix + (location.search || '') + (location.hash || ''));
  </script>
</head>

</body>
</html>
